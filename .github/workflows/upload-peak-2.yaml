name: Download and Upload PEAK

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar rclone

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Get gofile-downloader
        run: |
          git clone https://github.com/ltsdw/gofile-downloader.git
          pip install requests

      - name: Download from gofile
        run: |
          cd gofile-downloader
          python3 gofile-downloader.py "https://gofile.io/d/eqzFFE"

      - name: Extract
        run: |
          mkdir -p extracted
          find gofile-downloader -name '*.rar' -exec unrar x -o+ {} extracted/ \;

      - name: Upload to R2
        run: |
          rclone copy extracted/ "r2:nostaligafun-files/games/games-accualy/OTHER/Peak_Data/" \
            --transfers 8 --checkers 16 --fast-list --progress
