name: Download and Upload PEAK

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar aria2 rclone jq

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Download from gofile
        run: |
          CONTENT_ID="eqzFFE"

          TOKEN=$(curl -s -X POST https://api.gofile.io/accounts | jq -r '.data.token')
          echo "::add-mask::$TOKEN"

          WT=$(curl -s "https://gofile.io/dist/js/global.js" | grep -oP 'appdata\.wt\s*=\s*"\K[^"]+')

          RESP=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.gofile.io/contents/${CONTENT_ID}?wt=${WT}")

          mkdir -p downloads
          echo "$RESP" | jq -r '.data.children[] | .link' | while read -r url; do
            [ -z "$url" ] && continue
            aria2c -x16 -s16 -d downloads \
              --header="Cookie: accountToken=$TOKEN" \
              "$url"
          done

      - name: Extract
        run: |
          mkdir -p extracted
          for f in downloads/*.rar; do
            unrar x -o+ "$f" extracted/
          done

      - name: Upload to R2
        run: |
          rclone copy extracted/ "r2:nostaligafun-files/games/games-accualy/OTHER/Peak_Data/" \
            --transfers 8 --checkers 16 --fast-list --progress
