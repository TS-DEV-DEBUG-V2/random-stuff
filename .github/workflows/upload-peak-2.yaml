name: Download and Upload PEAK

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar aria2 rclone

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          acl = private
          EOF

      - name: Download RAR
        run: |
          aria2c -x16 -s16 -o is-ts-peak.rar \
            "https://store-na-phx-5.gofile.io/download/web/6f01d55a-c73b-4d08-827b-f1e1a2b8080d/is-ts-peak.rar"

      - name: Extract
        run: |
          mkdir -p extracted
          unrar x -o+ is-ts-peak.rar extracted/

      - name: Upload to R2
        run: |
          rclone copy extracted/ "r2:nostaligafun-files/games/games-accualy/OTHER/Peak_Data/" \
            --transfers 8 --checkers 16 --fast-list --progress
