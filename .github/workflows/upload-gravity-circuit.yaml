name: Gravity Circuit Upload

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GoFile Downloader
        run: |
          python -m pip install --upgrade pip
          pip install gofile-downloader

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download GoFile Share
        run: |
          mkdir -p download
          gofile-downloader "https://gofile.io/d/LxMlaX" -o download

      - name: Show Downloaded Files
        run: |
          find download -type f

      - name: Upload to Cloudflare R2
        run: |
          rclone copy download \
            r2:nostaligafun-files/games/games-accualy/OTHER/GravityCircuit_Data \
            --fast-list \
            --transfers 32 \
            --checkers 32 \
            --progress \
            --s3-no-bucket-check \
            --create-empty-src-dirs

      - name: Verify Upload
        run: |
          rclone lsf r2:nostaligafun-files/games/games-accualy/OTHER/GravityCircuit_Data
