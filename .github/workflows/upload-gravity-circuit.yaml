name: Download GoFile and Upload to R2

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gofile-downloader
        uses: actions/checkout@v4
        with:
          repository: ltsdw/gofile-downloader
          path: gofile-downloader

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download GoFile Share
        env:
          GF_DOWNLOAD_DIR: ${{ github.workspace }}/download
        run: |
          mkdir -p "$GF_DOWNLOAD_DIR"

          cd gofile-downloader

          uv run gofile-downloader.py "https://gofile.io/d/LxMlaX"

      - name: Show Downloaded Files
        run: |
          find download -type f

      - name: Upload to R2
        run: |
          rclone copy download \
            r2:nostaligafun-files/games/games-accualy/OTHER/GravityCircuit_Data \
            --fast-list \
            --transfers 32 \
            --checkers 32 \
            --progress \
            --s3-no-bucket-check \
            --create-empty-src-dirs
