name: Gravity Circuit Upload

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl wget
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download GoFile content
        run: |
          mkdir -p download

          CONTENT_ID="LxMlaX"

          curl -s "https://api.gofile.io/contents/${CONTENT_ID}" > response.json

          jq -r '
            .data.children
            | to_entries[]
            | select(.value.type=="file")
            | .value.link
          ' response.json > links.txt

          while read -r url; do
            [ -z "$url" ] && continue
            wget -c -P download "$url"
          done < links.txt

      - name: Show downloaded files
        run: |
          find download -type f

      - name: Upload to R2
        run: |
          rclone copy download \
            r2:nostaligafun-files/games/games-accualy/OTHER/GravityCircuit_Data \
            --fast-list \
            --transfers 32 \
            --checkers 32 \
            --progress \
            --s3-no-bucket-check \
            --create-empty-src-dirs
