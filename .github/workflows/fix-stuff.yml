name: Smart Video Convert + Upload to R2

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone curl

      - name: Download media files
        run: |
          mkdir -p input output

          curl -L -o input/spider-man-far-from-home.ts \
            "https://nostaligafun.pages.dev/games/games-accualy/APPS/MovieApp_Data/files/movies/spider-man-far-from-home.ts"

          curl -L -o input/spider-man-homecoming.mp4 \
            "https://nostaligafun.pages.dev/games/games-accualy/APPS/MovieApp_Data/files/movies/spider-man-homecoming.mp4"

          curl -L -o input/michael.mp4 \
            "https://nostaligafun.pages.dev/games/games-accualy/APPS/MovieApp_Data/files/movies/michael.mp4"

      - name: Smart convert pipeline
        run: |
          mkdir -p output

          for file in input/*; do
            name=$(basename "$file")
            base="${name%.*}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Processing: $name"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 1) FAST PATH: full stream copy
            ffmpeg -y -i "$file" \
              -c:v copy -c:a copy \
              -movflags +faststart \
              "output/${base}.mp4" && continue

            echo " Full copy failed → trying hybrid fixes"

            # 2) video copy, audio re-encode
            ffmpeg -y -i "$file" \
              -c:v copy \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "output/${base}.mp4" && continue

            echo "Video copy failed → trying audio copy"

            # 3) audio copy, video re-encode
            ffmpeg -y -i "$file" \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a copy \
              -movflags +faststart \
              "output/${base}.mp4" && continue

            echo "Full fallback re-encode"

            # 4) full encode fallback
            ffmpeg -y -i "$file" \
              -c:v libx264 -preset veryfast -crf 23 \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "output/${base}.mp4"
          done

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY }}
          secret_access_key = ${{ secrets.R2_SECRET_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          EOF

      - name: Upload to R2
        run: |
          for file in output/*.mp4; do
            filename=$(basename "$file")

            rclone copyto "$file" \
              "r2:nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies/$filename" \
              --s3-no-check-bucket \
              --progress \
              --stats 30s \
              --retries 999 \
              --low-level-retries 999
          done
