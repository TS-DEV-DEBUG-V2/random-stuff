name: Drive to R2
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install gdown and rclone
        run: |
          pip install --upgrade "gdown==5.2.0"
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download from Drive
        run: |
          mkdir -p drive_data
          python3 <<'PYEOF'
          import os
          import gdown
          import gdown.download_folder as df

          folder_url = "https://drive.google.com/drive/folders/1rM_wiU6k3TbIDvrp3kt72-4BFWO4GC7G"
          output_root = "drive_data"

          failed = []
          _orig_download = df.download

          def patched_download(*args, **kwargs):
              output = kwargs.get("output", "unknown")
              url = kwargs.get("url", args[0] if args else "")
              try:
                  result = _orig_download(*args, **kwargs)
                  if result is None:
                      raise RuntimeError("download returned None (likely quota or permission)")
                  return result
              except Exception as e:
                  print(f"\n=== FAILED: {output} ===\n{e}\n", flush=True)
                  failed.append((output, url, str(e)))
                  return output

          df.download = patched_download

          df.download_folder(
              url=folder_url,
              output=output_root,
              remaining_ok=True,
              resume=True,
              quiet=False,
          )

          with open("failed_files.txt", "w") as f:
              for output, url, err in failed:
                  f.write(f"{output}\t{url}\t{err}\n")

          print(f"\n===== SUMMARY =====")
          print(f"Failed files: {len(failed)}")
          for output, url, _ in failed:
              print(f"  - {output} ({url})")
          PYEOF
          du -sh drive_data || true

      - name: Upload failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-files
          path: failed_files.txt
          if-no-files-found: ignore

      - name: Upload to R2
        run: |
          rclone copy drive_data "r2:nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/sonicx" \
            --transfers 16 \
            --checkers 16 \
            --fast-list \
            --progress \
            --stats 30s \
            --retries 999 \
            --low-level-retries 999 \
            --s3-no-check-bucket
