name: shark tale
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAGNET: "magnet:?xt=urn:btih:045CFB5D0636CC9133D4B15C93733F901DF5C2D8&dn=Shark.Tale.2004.720p.BluRay.H264.AAC&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337&tr=udp%3A%2F%2Fopen.stealth.si%3A80%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce&tr=udp%3A%2F%2Ftracker.bittor.pw%3A1337%2Fannounce&tr=udp%3A%2F%2Fpublic.popcorn-tracker.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.dler.org%3A6969%2Fannounce&tr=udp%3A%2F%2Fexodus.desync.com%3A6969&tr=udp%3A%2F%2Fopen.demonii.com%3A1337%2Fannounce&tr=udp%3A%2F%2Fglotorrents.pw%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.coppersurfer.tk%3A6969&tr=udp%3A%2F%2Ftorrent.gresille.org%3A80%2Fannounce&tr=udp%3A%2F%2Fp4p.arenabg.com%3A1337&tr=udp%3A%2F%2Ftracker.internetwarriors.net%3A1337"
      OUTPUT_FILENAME: "shark-tale.mp4"
      R2_PATH: "nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies"
    steps:
      - name: Install rclone and webtorrent
        run: |
          curl https://rclone.org/install.sh | sudo bash
          sudo npm install -g webtorrent-cli
      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Download from magnet
        run: |
          mkdir -p downloads
          webtorrent download "$MAGNET" --out downloads
          echo "Downloaded files:"
          find downloads -type f -exec ls -lh {} \;
      - name: Rename mp4 and upload to R2
        run: |
          MP4=$(find downloads -type f -iname "*.mp4" | head -n1)
          if [ -z "$MP4" ]; then
            echo "No .mp4 file found in download"
            find downloads -type f
            exit 1
          fi
          echo "Found mp4: $MP4"
          RENAMED="downloads/$OUTPUT_FILENAME"
          mv "$MP4" "$RENAMED"
          ls -lh "$RENAMED"
          rclone copyto "$RENAMED" "r2:${R2_PATH}/${OUTPUT_FILENAME}" \
            --s3-no-check-bucket \
            --progress \
            --stats 30s \
            --retries 999 \
            --low-level-retries 999
