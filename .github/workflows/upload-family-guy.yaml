name: family-guy gdrive to r2
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install tools
        run: |
          curl https://rclone.org/install.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download folder with yt-dlp
        env:
          FOLDER_URL: https://drive.google.com/drive/folders/11W6C-Jqv9iQVasqjfiaYz77puax1UTjH
        run: |
          mkdir -p downloads
          cd downloads
          yt-dlp \
            --ignore-errors \
            --no-warnings \
            --retries 20 \
            --fragment-retries 20 \
            --retry-sleep 15 \
            --concurrent-fragments 4 \
            -o "%(playlist)s/%(title)s.%(ext)s" \
            "$FOLDER_URL" || true
          echo "--- downloaded tree ---"
          find . -maxdepth 3 -type f | head -200

      - name: Flatten any stray top-level files
        run: |
          cd downloads
          mkdir -p "Misc"
          for f in *; do
            if [ -f "$f" ]; then
              mv "$f" "Misc/"
            fi
          done
          rmdir "Misc" 2>/dev/null || true

      - name: Remux ts and mkv to mp4
        run: |
          cd downloads
          find . -type f \( -iname "*.ts" -o -iname "*.mkv" \) -print0 | while IFS= read -r -d '' src; do
            dst="${src%.*}.mp4"
            echo "Remux: $src -> $dst"
            if ffmpeg -hide_banner -loglevel error -y -i "$src" -map 0 -c copy -movflags +faststart "$dst"; then
              rm -f "$src"
            else
              echo "Full map failed, retrying video+audio only"
              if ffmpeg -hide_banner -loglevel error -y -i "$src" -map 0:v -map 0:a -c copy -movflags +faststart "$dst"; then
                rm -f "$src"
              else
                echo "FAILED: $src"
                rm -f "$dst"
              fi
            fi
          done

      - name: Build family-guy.json
        run: |
          python3 <<'PY'
          import os, re, json

          ROOT = "downloads"
          TAGS = r"\b(1080p|720p|480p|2160p|4k|uhd|x264|x265|h264|h265|hevc|avc|aac|ac3|dts|dd5\.?1|eac3|opus|bluray|brrip|bdrip|webrip|web-?dl|web|hdtv|dvdrip|remux|hdr|sdr|10bit|8bit|amzn|nf|hulu|dsnp|atvp|repack|proper|internal|limited|extended|uncensored|uncut|rerip|rarbg|yify|yts|ettv|eztv|fgt|sparks|cinefile|psa|joy|tigole|qxr|ntg|geckos|rovers|killers|lol|fov|dimension|drone|tbs|kogi|aaf|successfulcrab|flux|playweb|edith|smurf|naisu)\b"

          def clean(name):
              base, _ = os.path.splitext(name)
              s = base.replace(".", " ").replace("_", " ")
              s = re.sub(r"\[[^\]]*\]|\([^)]*\)|\{[^}]*\}", " ", s)
              s = re.sub(TAGS, " ", s, flags=re.I)
              s = re.sub(r"[\s\-]+", " ", s).strip(" -_.")
              m = re.search(r"\b[sS](\d{1,2})[eE](\d{1,3})\b", s)
              if m:
                  ep = int(m.group(2))
                  title = s[m.end():].strip(" -_.")
                  title = re.sub(r"\s+", " ", title).title()
                  return f"Episode {ep} - {title}" if title else f"Episode {ep}"
              return s or base

          out = {"show": "family-guy", "folders": []}
          if os.path.isdir(ROOT):
              for d in sorted(os.listdir(ROOT)):
                  p = os.path.join(ROOT, d)
                  if not os.path.isdir(p):
                      continue
                  files = []
                  for f in sorted(os.listdir(p)):
                      fp = os.path.join(p, f)
                      if os.path.isfile(fp):
                          files.append({"file": f, "clean_name": clean(f)})
                  if files:
                      out["folders"].append({"folder": d, "files": files})

          with open("family-guy.json", "w") as fh:
              json.dump(out, fh, indent=2, ensure_ascii=False)
          PY
          cat family-guy.json

      - name: Upload to R2
        run: |
          BASE="r2:nostaligafun-files/games/games-accualy/APPS/TvShowsApp_Data/files/family-guy"
          for season_dir in downloads/*/; do
            season=$(basename "$season_dir")
            echo "Uploading: $season"
            rclone copy "$season_dir" "$BASE/$season" \
              --s3-no-check-bucket \
              --transfers 2 \
              --retries 10 \
              --low-level-retries 30 \
              --stats 30s \
              --progress
          done
          rclone copy family-guy.json "$BASE/" \
            --s3-no-check-bucket \
            --retries 10
