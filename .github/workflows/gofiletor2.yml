name: A Gofile to R2 - SuperMarioOdyssey_Data

on:
  workflow_dispatch:
    inputs:
      gofile_url:
        description: Gofile link
        required: true
        default: https://gofile.io/d/AoG4RYys
      r2_dest:
        description: R2 destination
        required: true
        default: r2:nostaligafun-files/games/games-accualy/SWITCH/SuperMarioOdyssey_Data/

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Resolve Gofile links
        env:
          GOFILE_URL: ${{ inputs.gofile_url }}
        run: |
          mkdir -p work
          python3 - <<'EOF'
          import os, re, json, urllib.request

          url = os.environ["GOFILE_URL"].rstrip("/")
          cid = url.split("/")[-1]
          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"

          def call(u, method="GET", headers=None, data=None):
              h = {"User-Agent": ua}
              h.update(headers or {})
              r = urllib.request.Request(u, method=method, headers=h, data=data)
              with urllib.request.urlopen(r) as resp:
                  return resp.read().decode()

          token = json.loads(call("https://api.gofile.io/accounts", "POST", data=b"{}"))["data"]["token"]

          wt = "4fd6sg89d7s6"
          for js in ("https://gofile.io/dist/js/global.js", "https://gofile.io/dist/js/config.js", "https://gofile.io/dist/js/wt.obf.js"):
              try:
                  m = re.search(r'wt\s*[:=]\s*["\']([A-Za-z0-9]+)["\']', call(js))
                  if m:
                      wt = m.group(1)
                      break
              except Exception:
                  pass

          auth = {"Authorization": f"Bearer {token}", "X-Website-Token": wt}
          entries = []

          def walk(content_id, prefix=""):
              data = json.loads(call(f"https://api.gofile.io/contents/{content_id}?wt={wt}", headers=auth))
              if data.get("status") != "ok":
                  raise SystemExit(f"Gofile error: {data}")
              node = data["data"]
              if node.get("type") == "file":
                  entries.append((node["link"], prefix + node["name"]))
                  return
              for child in node.get("children", {}).values():
                  if child["type"] == "folder":
                      walk(child["id"], prefix + child["name"] + "/")
                  else:
                      entries.append((child["link"], prefix + child["name"]))

          walk(cid)
          if not entries:
              raise SystemExit("No files found")

          with open("aria2.txt", "w") as f:
              for link, name in entries:
                  f.write(f"{link}\n  out={name}\n  header=Cookie: accountToken={token}\n  header=User-Agent: {ua}\n")
          for _, name in entries:
              print(name)
          EOF

      - name: Download
        working-directory: work
        run: |
          aria2c -i ../aria2.txt -x 16 -s 16 -j 4 -k 1M --file-allocation=none --max-tries=10 --retry-wait=5 --summary-interval=30
          ls -la

      - name: Extract to .
        working-directory: work
        run: |
          shopt -s nullglob nocaseglob
          archives=( *.zip *.7z *.rar )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No archives found"
            exit 1
          fi
          for a in "${archives[@]}"; do
            7z x -y "$a" -o.
            rm -f "$a"
          done
          rm -f *.z0* *.7z.0* *.part*.rar
          du -sh .
          find . -maxdepth 2 | head -50

      - name: Upload to R2
        working-directory: work
        run: |
          rclone copy . "${{ inputs.r2_dest }}" \
            --transfers 32 \
            --checkers 32 \
            --s3-upload-concurrency 8 \
            --s3-chunk-size 64M \
            --fast-list \
            --stats 30s \
            --stats-one-line \
            -v
          rclone size "${{ inputs.r2_dest }}"
