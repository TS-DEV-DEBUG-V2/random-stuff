name: A magnet-to-r2

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: Magnet link
        required: true
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAGNET: ${{ inputs.magnet }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_REGION: auto
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Download
        run: |
          mkdir -p dl
          aria2c \
            --dir=dl \
            --seed-time=0 \
            --bt-stop-timeout=900 \
            --max-connection-per-server=16 \
            --bt-max-peers=200 \
            --enable-dht=true \
            --file-allocation=none \
            --summary-interval=30 \
            --console-log-level=warn \
            "$MAGNET"

      - name: Extract
        run: |
          FILE="$(find dl -type f -iname '*.zip' -printf '%s\t%p\n' | sort -nr | head -n 1 | cut -f2-)"
          if [ -z "$FILE" ]; then
            echo "no zip found"
            ls -laR dl
            exit 1
          fi
          sudo mkdir -p /WORKFILES
          sudo chown "$USER" /WORKFILES
          unzip -q "$FILE" -d /WORKFILES
          rm -rf dl
          df -h /

      - name: Upload
        run: |
          rclone copy /WORKFILES "r2:nostaligafun-files/games/games-accualy/OTHER/WORKSTUFF_Data/" \
            --s3-no-check-bucket \
            --transfers 16 \
            --checkers 16 \
            --s3-upload-concurrency 8 \
            --s3-chunk-size 64M \
            --progress \
            --stats 30s
