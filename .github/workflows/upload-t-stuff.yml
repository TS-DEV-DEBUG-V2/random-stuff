name: TORRENT 2 R2
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_PATH: "nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rclone, aria2, ffmpeg
        run: |
          curl https://rclone.org/install.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Process every torrent in /t
        run: |
          shopt -s nullglob nocaseglob
          TORRENTS=(t/*.torrent)
          shopt -u nocaseglob
          if [ ${#TORRENTS[@]} -eq 0 ]; then
            echo "No .torrent files found in t/"
            exit 1
          fi

          TRACKERS="udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.openbittorrent.com:6969/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://explodie.org:6969/announce,udp://opentracker.i2p.rocks:6969/announce,udp://tracker.tiny-vps.com:6969/announce,udp://tracker.moeking.me:6969/announce,udp://tracker.dler.org:6969/announce"

          for TORRENT in "${TORRENTS[@]}"; do
            BASENAME=$(basename "$TORRENT" .torrent)
            OUTPUT_FILENAME="${BASENAME}.mp4"
            WORKDIR=$(mktemp -d)
            echo "=============================="
            echo "Processing: $TORRENT"
            echo "Target name: $OUTPUT_FILENAME"
            echo "Workdir: $WORKDIR"
            echo "=============================="

            aria2c \
              --dir="$WORKDIR" \
              --seed-time=0 \
              --bt-stop-timeout=600 \
              --max-connection-per-server=16 \
              --split=16 \
              --summary-interval=30 \
              --bt-save-metadata=false \
              --enable-dht=true \
              --enable-dht6=true \
              --bt-enable-lpd=true \
              --enable-peer-exchange=true \
              --dht-listen-port=6881-6999 \
              --listen-port=6881-6999 \
              --bt-tracker="$TRACKERS" \
              "$TORRENT" || echo "aria2 exited non-zero (likely no peers / timeout); checking what we got"

            echo "Downloaded files:"
            find "$WORKDIR" -type f -exec ls -lh {} \;

            MEDIA=$(find "$WORKDIR" -type f \( -iname "*.mp4" -o -iname "*.mkv" \) ! -iname "*sample*" ! -name "*.aria2" -printf "%s\t%p\n" | sort -rn | head -n1 | cut -f2-)
            if [ -z "$MEDIA" ]; then
              echo "No complete .mp4 or .mkv found for $TORRENT, skipping"
              rm -rf "$WORKDIR"
              continue
            fi

            if [ -f "${MEDIA}.aria2" ]; then
              echo "Selected media still has .aria2 control file (incomplete), skipping"
              rm -rf "$WORKDIR"
              continue
            fi

            echo "Selected media: $MEDIA"
            FINAL="$WORKDIR/$OUTPUT_FILENAME"
            EXT="${MEDIA##*.}"
            EXT_LC=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')

            if [ "$EXT_LC" = "mkv" ]; then
              echo "Remuxing mkv -> mp4 (no re-encode)"
              if ! ffmpeg -y -i "$MEDIA" -map 0 -c copy -movflags +faststart "$FINAL"; then
                echo "ffmpeg failed, retrying without subtitle tracks"
                ffmpeg -y -i "$MEDIA" -map 0 -map -0:s -c copy -movflags +faststart "$FINAL" || { echo "remux failed, skipping"; rm -rf "$WORKDIR"; continue; }
              fi
              rm -f "$MEDIA"
            else
              if [ "$MEDIA" != "$FINAL" ]; then
                mv "$MEDIA" "$FINAL"
              fi
            fi

            ls -lh "$FINAL"

            rclone copyto "$FINAL" "r2:${R2_PATH}/${OUTPUT_FILENAME}" \
              --s3-no-check-bucket \
              --progress \
              --stats 30s \
              --retries 999 \
              --low-level-retries 999 || echo "rclone upload failed for $OUTPUT_FILENAME"

            rm -rf "$WORKDIR"
          done
