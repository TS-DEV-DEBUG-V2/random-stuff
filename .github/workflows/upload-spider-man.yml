name: Spider man into spider verse upload stuff
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          GDRIVE_SECRET: ${{ secrets.GDRIVE_SECRET }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.readonly
          token = ${GDRIVE_SECRET}

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Verify remotes
        run: |
          rclone listremotes
          rclone lsd gdrive: --drive-root-folder-id 1rM_wiU6k3TbIDvrp3kt72-4BFWO4GC7G

      - name: Copy file
        run: |
              rclone copyto "gdrive:" "r2:nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies/spider-man-into-the-spider-verse.mp4" \
                  --drive-root-folder-id "1V3Bq0lrDQUxJay5DDs3gK69ZvRNb1j2u" \
                  --transfers 4 \
                  --progress \
                  --stats 30s \
                  --retries 999 \
                  --low-level-retries 999 \
                  --s3-no-check-bucket
