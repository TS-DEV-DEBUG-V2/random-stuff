name: Spider man into spider verse upload stuff
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install gdown and rclone
        run: |
          pip install --upgrade gdown
          curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Download file
        run: |
          gdown "https://drive.google.com/uc?id=1V3Bq0lrDQUxJay5DDs3gK69ZvRNb1j2u" -O spider-man-into-the-spider-verse.mp4
          ls -lh spider-man-into-the-spider-verse.mp4

      - name: Upload to R2
        run: |
          rclone copyto "spider-man-into-the-spider-verse.mp4" "r2:nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies/spider-man-into-the-spider-verse.mp4" \
            --s3-no-check-bucket \
            --progress \
            --stats 30s \
            --retries 999 \
            --low-level-retries 999
