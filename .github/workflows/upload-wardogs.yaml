name: A upload la grande 
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAGNET: "/assets/la-grande-vadrouille.torrent"
      SUBTITLES: "/assets/la-grande-vadrouille.srt"
      OUTPUT_FILENAME: "la-grande-vadrouille.mp4"
      R2_PATH: "nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/movies"
      TIMELINES_PATH: "nostaligafun-files/games/games-accualy/APPS/MovieApp_Data/files/timelines/movies"
    steps:
      - name: Install deps
        run: |
          curl https://rclone.org/install.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg webp fonts-dejavu-core uchardet
      - name: Write rclone config
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY}
          secret_access_key = ${R2_SECRET_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF
          chmod 600 ~/.config/rclone/rclone.conf
      - uses: actions/checkout@v4
      - name: Check subtitles exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/$SUBTITLES" ]; then
            echo "Subtitle file not found: $SUBTITLES"
            exit 1
          fi
      - name: Download from torrent
        run: |
          mkdir -p downloads
          aria2c \
            --dir=downloads \
            --seed-time=0 \
            --bt-stop-timeout=300 \
            --max-connection-per-server=16 \
            --split=16 \
            --summary-interval=30 \
            --bt-save-metadata=false \
            "$GITHUB_WORKSPACE/$MAGNET"
          echo "Downloaded files:"
          find downloads -type f -exec ls -lh {} \;
      - name: Rename mp4
        run: |
          MP4=$(find downloads -type f -iname "*.mp4" ! -iname "*sample*" | head -n1)
          if [ -z "$MP4" ]; then
            echo "No valid .mp4 file found in download (excluding Sample)"
            find downloads -type f
            exit 1
          fi
          echo "Found mp4: $MP4"
          RENAMED="downloads/$OUTPUT_FILENAME"
          mv "$MP4" "$RENAMED"
          ls -lh "$RENAMED"
      - name: Generate timeline
        run: |
          set -e
          cd downloads
          BASE="${OUTPUT_FILENAME%.*}"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT_FILENAME" | cut -d. -f1)
          if [ -z "$DURATION" ] || [ "$DURATION" -lt 1 ]; then
            echo "bad duration"
            exit 1
          fi
          INTERVAL=10
          W=160
          H=90
          COUNT=$(( (DURATION + INTERVAL - 1) / INTERVAL ))
          COLS=$(awk -v c=$COUNT 'BEGIN{r=int(sqrt(c)); if(r*r<c)r++; print r}')
          ffmpeg -hide_banner -loglevel error -y -i "$OUTPUT_FILENAME" \
            -vf "fps=1/$INTERVAL,scale=$W:$H,tile=${COLS}x${COLS}" \
            -frames:v 1 sprite.png
          cwebp -q 70 sprite.png -o "$BASE.webp"
          {
            echo "WEBVTT"
            echo ""
            for ((i=0; i<COUNT; i++)); do
              START=$((i * INTERVAL))
              END=$((START + INTERVAL))
              [ $END -gt $DURATION ] && END=$DURATION
              X=$(( (i % COLS) * W ))
              Y=$(( (i / COLS) * H ))
              printf '%02d:%02d:%02d.000 --> %02d:%02d:%02d.000\n%s.webp#xywh=%d,%d,%d,%d\n\n' \
                $((START/3600)) $((START%3600/60)) $((START%60)) \
                $((END/3600)) $((END%3600/60)) $((END%60)) \
                "$BASE" $X $Y $W $H
            done
          } > "$BASE.vtt"
          rm -f sprite.png
          ls -lh "$BASE.webp" "$BASE.vtt"
      - name: Burn subtitles into video
        run: |
          set -e
          cd downloads
          SRC_SRT="$GITHUB_WORKSPACE/$SUBTITLES"
          ENC=$(uchardet "$SRC_SRT" || echo "UTF-8")
          echo "Detected subtitle encoding: $ENC"
          case "$ENC" in
            UTF-8|ASCII|utf-8|ascii) cp "$SRC_SRT" subs.srt ;;
            *) iconv -f "$ENC" -t UTF-8 "$SRC_SRT" -o subs.srt || iconv -f WINDOWS-1252 -t UTF-8 "$SRC_SRT" -o subs.srt ;;
          esac
          sed -i 's/\r$//' subs.srt
          ffmpeg -hide_banner -y -i "$OUTPUT_FILENAME" \
            -map 0:v:0 -map 0:a? \
            -vf "subtitles=subs.srt:charenc=UTF-8:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=0,MarginV=24'" \
            -c:v libx264 -preset veryfast -crf 20 -tune film -pix_fmt yuv420p \
            -c:a copy -sn \
            -movflags +faststart \
            -stats_period 30 \
            burned.mp4
          mv -f burned.mp4 "$OUTPUT_FILENAME"
          rm -f subs.srt
          ls -lh "$OUTPUT_FILENAME"
      - name: Upload video and timeline to R2
        run: |
          set -e
          cd downloads
          BASE="${OUTPUT_FILENAME%.*}"
          RCLONE_FLAGS="--s3-no-check-bucket --progress --stats 30s --retries 999 --low-level-retries 999"
          rclone copyto "$OUTPUT_FILENAME" "r2:${R2_PATH}/${OUTPUT_FILENAME}" $RCLONE_FLAGS
          rclone copyto "$BASE.webp" "r2:${TIMELINES_PATH}/$BASE.webp" $RCLONE_FLAGS
          rclone copyto "$BASE.vtt"  "r2:${TIMELINES_PATH}/$BASE.vtt"  $RCLONE_FLAGS
